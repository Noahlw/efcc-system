name: Candidate checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout the event-tested commit and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2
          run_install: false

      - name: Install and verify pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          log="$RUNNER_TEMP/actionlint-install.log"
          if ! curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive" >"$log" 2>&1; then
            echo "::error::Could not download the pinned actionlint release."
            exit 1
          fi
          if ! printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --status; then
            echo "::error::The pinned actionlint archive failed its checksum."
            exit 1
          fi
          if ! tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint >>"$log" 2>&1; then
            echo "::error::Could not extract the pinned actionlint release."
            exit 1
          fi
          chmod 0755 "$RUNNER_TEMP/actionlint"
          echo "Pinned actionlint 1.7.12 installed and checksum verified."

      - name: Lint every GitHub Actions workflow
        shell: bash
        run: |
          set -euo pipefail
          if ! "$RUNNER_TEMP/actionlint" >"$RUNNER_TEMP/actionlint.log" 2>&1; then
            echo "::error::actionlint rejected a workflow; diagnostics are withheld from the public log."
            exit 1
          fi
          echo "actionlint passed for all repository workflows."

      - name: Run source-bound light checks (Native qualification is local)
        id: qualification
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/test-runner.ts affected --ci

      - name: Publish candidate production-source unit coverage
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2
        with:
          github-token: ${{ github.token }}
          comment-on: none
          json-summary-path: coverage/production-source-unit/coverage-summary.json
          json-final-path: coverage/production-source-unit/coverage-final.json
          file-coverage-mode: all
          file-coverage-expanded: false
          file-coverage-root-path: ${{ runner.temp }}/efcc-gate-source/source
