version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      routine-dev-tooling:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "@commitlint/*"
          - husky
          - lint-staged
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      routine-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
